name: Build & Release ORION Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | ${{ env.ANDROID_HOME }}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew
        working-directory: android-chess-src

      - name: Build FOSS Release APK
        run: ./gradlew assembleFossRelease --no-daemon --stacktrace
        working-directory: android-chess-src

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-artifacts
          APK_FILE=$(find android-chess-src/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK was generated!"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" build-artifacts/ORION-Chess-AI.apk
          ls -lh build-artifacts/

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ORION-Chess-AI-APK
          path: build-artifacts/ORION-Chess-AI.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: "ORION Chess AI Mobile App (v0.6)"
          body: |
            # 🌌 ORION Chess AI - Android Release

            🚀 **Automated Continuous Delivery Build**
            This APK is compiled, bundled, and signed automatically by GitHub Actions directly from the latest repository source.

            ---

            ### 📦 Direct APK Download
            - **[Download ORION-Chess-AI.apk](https://github.com/${{ github.repository }}/releases/download/mobile-latest/ORION-Chess-AI.apk)**

            ---

            ### 📲 Installation Guide
            1. Download `ORION-Chess-AI.apk` to your Android device.
            2. Tap the downloaded file in your notification bar or file manager.
            3. When prompted, allow *"Install unknown apps"* for your browser/file manager.
            4. Tap **Install** and launch **ORION Chess AI**!

            ---

            ### ⚙️ Engine Server Connection
            - **With Neural Model**: Run the server on your computer:
              ```powershell
              python cli.py app --port 8000
              ```
              In Android app settings, set engine URL to your PC's IP (e.g. `http://192.168.1.10:8000`).
            - **Offline Mode**: The app automatically uses the built-in local engine whenever the network server is not running.
          files: build-artifacts/ORION-Chess-AI.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
